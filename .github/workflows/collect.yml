name: 시리즈 다운로드수 수집

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Seoul

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 다운로드수 수집
        run: python collect.py --debug
        continue-on-error: true

      - name: 디버그 HTML 업로드
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_*.html
          if-no-files-found: ignore

      - name: 결과 커밋
        run: |
          git config user.name "series-collect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/records.json data/data.js
          git diff --cached --quiet || git commit -m "수집: $(date +%Y-%m-%d)"
          git push
