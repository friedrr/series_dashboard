name: 시리즈 다운로드수 수집

on:
  schedule:
    # UTC 기준 00:00 = 한국시간 오전 9시 (매일)
    - cron: '0 0 * * *'
  workflow_dispatch:   # Actions 탭에서 수동 실행 버튼 활성화 (테스트용)

permissions:
  contents: write      # 수집 결과를 저장소에 커밋하기 위해 필요

env:
  TZ: Asia/Seoul       # collect.py가 한국 날짜로 기록하도록 설정

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 다운로드수 수집
        run: python collect.py

      - name: 결과 커밋
        run: |
          git config user.name "series-collect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/records.json data/data.js
          git diff --cached --quiet || git commit -m "수집: $(date +%Y-%m-%d)"
          git push
